name: openEQUELLA Bulk Importer CI

on:
  push:
    branches:
      - master
      - develop
      - release/**
    paths:
      - '**.py'
      - '**.spec'
      - 'package-*/**'
      - '.github/workflows/ci.yaml'
      - 'requirements.txt'
  pull_request:
    branches:
      - master
      - develop
      - release/**
    paths:
      - '**.py'
      - '**.spec'
      - 'package-*/**'
      - '.github/workflows/ci.yaml'
      - 'requirements.txt'

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext python3-dev libgtk-3-dev
          
      - name: Install Python Dependencies
        run: |
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-20.04 -r requirements.txt pyinstaller

      - name: Build Linux Package
        working-directory: package-linux
        run: bash package.sh
        
      - name: Rename Artifact
        run: mv package-linux/ebi.zip ebi-linux.zip
        
      - name: Save Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-linux
          path: ebi-linux.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Mac Package
        working-directory: package-mac
        run: bash ebi-package.command
        
      - name: Save Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-mac
          path: package-mac/dist/ebi.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Windows Package
        working-directory: package-win
        run: cmd /c package.bat
        
      - name: Rename Artifact
        run: Move-Item package-win\ebi.zip ebi-windows.zip
        
      - name: Save Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-windows
          path: ebi-windows.zip
