name: openEQUELLA Bulk Importer CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - master
      - develop
      - release/**
    tags:
      - '*'
    paths:
      - '**.py'
      - '**.spec'
      - 'package-*/**'
      - '.github/workflows/ci.yaml'
      - 'requirements.txt'
  pull_request:
    branches:
      - master
      - develop
      - release/**
    paths:
      - '**.py'
      - '**.spec'
      - 'package-*/**'
      - '.github/workflows/ci.yaml'
      - 'requirements.txt'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext python3-dev libgtk-3-dev \
            libnotify4 libsdl2-2.0-0
          
      - name: Install Python Dependencies
        run: |
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 -r requirements.txt pyinstaller

      - name: Build Linux Package
        working-directory: package-linux
        run: bash package.sh
        
      - name: Rename Artifact
        run: mv package-linux/ebi.zip ebi-linux.zip
        
      - name: Save Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ebi-linux
          path: ebi-linux.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Mac Package
        working-directory: package-mac
        run: bash ebi-package.command
        
      - name: Save Mac Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ebi-mac
          path: package-mac/dist/ebi.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Windows Package
        working-directory: package-win
        run: cmd /c package.bat
        
      - name: Rename Artifact
        run: Move-Item package-win\ebi.zip ebi-windows.zip
        
      - name: Save Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ebi-windows
          path: ebi-windows.zip

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: ebi-linux
          path: release-assets/ebi-linux

      - name: Download Mac Artifact
        uses: actions/download-artifact@v8
        with:
          name: ebi-mac
          path: release-assets/ebi-mac

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: ebi-windows
          path: release-assets/ebi-windows

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ebi-linux/ebi-linux.zip
            release-assets/ebi-mac/ebi.dmg
            release-assets/ebi-windows/ebi-windows.zip
