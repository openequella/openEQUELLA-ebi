name: openEQUELLA Admin Console Launcher CI

on:
  push:
    branches:
      - master
      - develop
      - release/**
    tags:
      - "**"
  pull_request:
    branches:
      - master
      - develop
      - release/**

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext python3-dev libgtk-3-dev
          
      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-20.04 wxPython>=4.2.0
          pip install pyinstaller

      - name: Build Linux Package
        working-directory: package-linux
        run: bash package.sh
        
      - name: Rename Artefact
        run: mv package-linux/ebi.zip ebi-linux.zip
        
      - name: Save Linux Artefact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-linux
          path: ebi-linux.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Mac Package
        working-directory: package-mac
        run: bash ebi-package.command
        
      - name: Save Mac Artefact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-mac
          path: package-mac/dist/ebi.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install wxPython
          pip install pyinstaller

      - name: Build Windows Package
        working-directory: package-win
        run: cmd /c package.bat
        
      - name: Rename Artefact
        run: rename package-win\ebi.zip ebi-windows.zip
        
      - name: Save Windows Artefact
        uses: actions/upload-artifact@v4
        with:
          name: ebi-windows
          path: ebi-windows.zip

  release:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artefact
        uses: actions/download-artifact@v4
        with:
          name: ebi-linux
          path: out
      - name: Download Mac Artefact
        uses: actions/download-artifact@v4
        with:
          name: ebi-mac
          path: out
      - name: Download Windows Artefact
        uses: actions/download-artifact@v4
        with:
          name: ebi-windows
          path: out
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
