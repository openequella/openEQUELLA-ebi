name: Release EBI Packages

on:
  workflow_dispatch:  # Added to allow manual triggering from the Actions tab

jobs:
  build:
    name: Build on ${{ matrix.osName }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            osName: Windows
            script_dir: package-win
            script_cmd: .\package.bat
            artifact: ebi-windows.zip
          - os: ubuntu-22.04
            osName: Linux
            script_dir: package-linux
            script_cmd: bash package.sh
            artifact: ebi-linux.zip
          - os: macos-latest
            osName: macOS
            script_dir: package-mac
            script_cmd: bash ebi-package.command
            artifact: ebi-macos.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext python3-dev libgtk-3-dev
      
      - name: Install wxPython (Linux)
        if: runner.os == 'Linux'
        run: |
          # Use pre-built wheels to avoid long compilation time native to Ubuntu runners
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython>=4.2.0

      - name: Install Dependencies
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Same as above without wxPython which was explicitly fetched via wheels in prior step
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Package
        working-directory: ${{ matrix.script_dir }}
        run: ${{ matrix.script_cmd }}

      - name: Identify Artifact Path (Windows/Linux)
        if: runner.os != 'macOS'
        run: echo "UPLOAD_PATH=${{ matrix.script_dir }}/ebi.zip" >> $GITHUB_ENV
        shell: bash

      - name: Identify Artifact Path (macOS)
        if: runner.os == 'macOS'
        run: echo "UPLOAD_PATH=${{ matrix.script_dir }}/dist/ebi.dmg" >> $GITHUB_ENV
        shell: bash

      - name: Rename Artifact for OS
        run: |
          mv $UPLOAD_PATH ${{ matrix.artifact }}
          echo "UPLOAD_PATH=${{ matrix.artifact }}" >> $GITHUB_ENV
        shell: bash

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.UPLOAD_PATH }}
